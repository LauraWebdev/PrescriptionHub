name: Nightly

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive nightly version
        id: version
        run: |
          set -euo pipefail
          day="$(date -u +'%Y%m%d')"
          {
            echo "day=${day}"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +'%Y-%m-%d')"
            echo "name=nightly-${day}-$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          # The run number just has to keep climbing; nightlies are debug-signed and so are
          # never upgraded to or from a release build.
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew assembleDebug -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE" --stacktrace

      - name: Collect build metadata
        id: meta
        env:
          DAY: ${{ steps.version.outputs.day }}
          SHA: ${{ steps.version.outputs.sha }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          set -euo pipefail
          apk="prescription-hub-nightly-${DAY}-${SHA}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          {
            echo "tag=nightly-${DAY}-${SHA}"
            echo "title=Nightly ${DATE} (${SHA})"
            echo "apk=${apk}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          APK: ${{ steps.meta.outputs.apk }}
        run: |
          set -euo pipefail
          # Make re-runs of the same commit idempotent.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --prerelease \
            --notes "Automated debug build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}."
