name: Nightly

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect build metadata
        id: meta
        run: |
          set -euo pipefail
          day="$(date -u +'%Y%m%d')"
          sha="$(git rev-parse --short HEAD)"
          apk="prescription-hub-nightly-${day}-${sha}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          {
            echo "tag=nightly-${day}-${sha}"
            echo "title=Nightly $(date -u +'%Y-%m-%d') (${sha})"
            echo "apk=${apk}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          APK: ${{ steps.meta.outputs.apk }}
        run: |
          set -euo pipefail
          # Make re-runs of the same commit idempotent.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --prerelease \
            --notes "Automated debug build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}."
